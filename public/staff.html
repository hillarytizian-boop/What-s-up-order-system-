<!DOCTYPE html>
<html>
<head>
    <title>Staff Panel - TableBite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; }
        .order-card { background: white; border-radius: 16px; margin-bottom: 15px; padding: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .status-badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container"><span class="navbar-brand">🍽️ TableBite Staff</span><button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button></div>
</nav>
<div class="container mt-4">
    <h3>All Orders</h3>
    <div id="orders-list" class="mt-3"></div>
</div>
<script>
    const token = localStorage.getItem('authToken');
    if (!token) { window.location.href = '/staff-login.html'; }

    async function apiCall(url, options = {}) {
        const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
        const res = await fetch(url, { ...options, headers });
        if (res.status === 401 || res.status === 403) { localStorage.removeItem('authToken'); window.location.href = '/staff-login.html'; }
        if (!res.ok) throw new Error(await res.text());
        return res.json();
    }

    async function loadOrders() {
        const orders = await apiCall('/api/staff/orders');
        document.getElementById('orders-list').innerHTML = orders.map(order => `
            <div class="order-card">
                <div class="d-flex justify-content-between align-items-start">
                    <div><strong>Order #${order.id}</strong> by ${order.customer_name || order.user_id || 'Guest'}<br><small>${new Date(order.created_at).toLocaleString()}</small></div>
                    <div>
                        <select data-id="${order.id}" class="form-select form-select-sm status-select" style="width:130px">
                            <option ${order.status === 'pending' ? 'selected' : ''} value="pending">Pending</option>
                            <option ${order.status === 'preparing' ? 'selected' : ''} value="preparing">Preparing</option>
                            <option ${order.status === 'ready' ? 'selected' : ''} value="ready">Ready</option>
                            <option ${order.status === 'completed' ? 'selected' : ''} value="completed">Completed</option>
                        </select>
                    </div>
                </div>
                <div><strong>Total:</strong> $${order.total.toFixed(2)} | <strong>Items:</strong> ${JSON.parse(order.items).map(i=>i.name).join(', ')}</div>
                ${order.location_lat ? `<div><small>📍 Location: ${order.location_lat}, ${order.location_lng}</small></div>` : ''}
            </div>
        `).join('');
        document.querySelectorAll('.status-select').forEach(select => {
            select.addEventListener('change', async (e) => {
                const id = select.dataset.id;
                const status = select.value;
                await apiCall(`/api/staff/orders/${id}/status`, { method: 'PUT', body: JSON.stringify({ status }) });
                loadOrders();
            });
        });
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('authToken');
        window.location.href = '/staff-login.html';
    });

    loadOrders();
</script>
</body>
</html>
