<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>TableBite - Restaurant Ordering</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f1f2f6; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding-bottom: 90px; }
        .hero-card { background: linear-gradient(135deg, #ff4757, #e63946); color: white; border-radius: 0 0 30px 30px; padding: 40px 20px; margin-bottom: 20px; text-align: center; }
        .category-pill { background: white; border: 1px solid #dee2e6; padding: 8px 20px; border-radius: 30px; font-size: 14px; font-weight: 500; transition: all 0.2s; cursor: pointer; display: inline-block; margin-right: 10px; margin-bottom: 10px; }
        .category-pill.active { background: #ff4757; color: white; border-color: #ff4757; }
        .menu-card { background: white; border-radius: 20px; padding: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); transition: transform 0.2s; cursor: pointer; }
        .menu-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .menu-card img { width: 100%; height: 140px; object-fit: cover; border-radius: 15px; }
        .price { color: #ff4757; font-weight: bold; font-size: 1.2rem; }
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background: #2f3542; border-radius: 40px; padding: 10px 20px; display: flex; justify-content: space-around; z-index: 1000; }
        .bottom-nav .btn { font-size: 1.2rem; opacity: 0.7; color: white; }
        .bottom-nav .btn.active { opacity: 1; color: #ff4757; }
        .cart-badge { position: absolute; top: -8px; right: -12px; background: #ff4757; color: white; border-radius: 50%; padding: 2px 6px; font-size: 11px; min-width: 18px; }
        .cart-drawer { position: fixed; bottom: 0; left: 0; width: 100%; max-height: 80vh; background: white; border-radius: 30px 30px 0 0; z-index: 1100; transform: translateY(100%); transition: transform 0.3s; display: flex; flex-direction: column; }
        .cart-drawer.open { transform: translateY(0); }
        .cart-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1050; display: none; }
        .cart-header { padding: 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .cart-items { flex: 1; overflow-y: auto; padding: 15px; }
        .cart-footer { padding: 20px; border-top: 1px solid #eee; }
        @media (max-width: 576px) { .hero-card h1 { font-size: 1.8rem; } }
    </style>
</head>
<body>
    <div class="hero-card">
        <h1>🍽️ TableBite</h1>
        <p>Premium Dining Experience – Order from your table</p>
    </div>

    <div class="container mt-4">
        <div id="categories" class="mb-4"></div>
        <div id="menu-container" class="row"></div>
    </div>

    <div class="bottom-nav">
        <button id="nav-menu" class="btn active">📋 Menu</button>
        <button id="nav-cart" class="btn position-relative">🛒 Cart <span id="cart-count" class="cart-badge">0</span></button>
        <button id="nav-track" class="btn">📍 Track</button>
    </div>

    <div id="cart-overlay" class="cart-overlay"></div>
    <div id="cart-drawer" class="cart-drawer">
        <div class="cart-header"><h4>Your Order</h4><button id="close-cart" class="btn-close"></button></div>
        <div id="cart-items" class="cart-items"></div>
        <div class="cart-footer">
            <div class="d-flex justify-content-between mb-3"><strong>Total:</strong><strong id="cart-total">$0.00</strong></div>
            <button id="checkout-btn" class="btn btn-primary w-100">Place Order</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Global state
        let menuItems = [];
        let cart = [];
        let currentCategory = 'all';

        // DOM elements
        const menuContainer = document.getElementById('menu-container');
        const categoriesContainer = document.getElementById('categories');
        const cartDrawer = document.getElementById('cart-drawer');
        const cartOverlay = document.getElementById('cart-overlay');
        const cartItemsDiv = document.getElementById('cart-items');
        const cartTotalSpan = document.getElementById('cart-total');
        const cartCountSpan = document.getElementById('cart-count');
        const navMenu = document.getElementById('nav-menu');
        const navCart = document.getElementById('nav-cart');
        const navTrack = document.getElementById('nav-track');
        const closeCartBtn = document.getElementById('close-cart');
        const checkoutBtn = document.getElementById('checkout-btn');

        async function loadMenu() {
            try {
                const res = await fetch('/api/menu');
                menuItems = await res.json();
                renderCategories();
                renderMenu();
            } catch(err) { console.error(err); menuContainer.innerHTML = '<div class="alert alert-danger">Failed to load menu</div>'; }
        }

        function renderCategories() {
            const categories = ['all', ...new Set(menuItems.map(item => item.category))];
            categoriesContainer.innerHTML = categories.map(cat => 
                `<span class="category-pill ${cat === currentCategory ? 'active' : ''}" data-category="${cat}">${cat.charAt(0).toUpperCase() + cat.slice(1)}</span>`
            ).join('');
            document.querySelectorAll('.category-pill').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentCategory = btn.dataset.category;
                    document.querySelectorAll('.category-pill').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderMenu();
                });
            });
        }

        function renderMenu() {
            let filtered = currentCategory === 'all' ? menuItems : menuItems.filter(item => item.category === currentCategory);
            if (filtered.length === 0) { menuContainer.innerHTML = '<div class="col-12 text-center">No items</div>'; return; }
            menuContainer.innerHTML = filtered.map(item => `
                <div class="col-md-4 col-sm-6">
                    <div class="menu-card" data-id="${item.id}">
                        <img src="${item.image}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/400x300?text=Food'">
                        <div class="mt-2">
                            <h6 class="mb-1">${item.name}</h6>
                            <p class="small text-muted mb-1">${item.description.substring(0, 60)}</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="price">$${item.price.toFixed(2)}</span>
                                <button class="btn btn-sm btn-primary add-to-cart" data-id="${item.id}">+ Add</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            document.querySelectorAll('.add-to-cart').forEach(btn => {
                btn.addEventListener('click', (e) => { e.stopPropagation(); addToCart(parseInt(btn.dataset.id)); });
            });
        }

        function addToCart(itemId) {
            const item = menuItems.find(i => i.id === itemId);
            if (!item) return;
            const existing = cart.find(i => i.id === itemId);
            if (existing) existing.quantity++;
            else cart.push({ ...item, quantity: 1 });
            updateCartUI();
        }

        function updateCartUI() {
            const totalItems = cart.reduce((s, i) => s + i.quantity, 0);
            cartCountSpan.textContent = totalItems;
            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<div class="text-center text-muted">Your cart is empty</div>';
                cartTotalSpan.textContent = '$0.00';
                return;
            }
            cartItemsDiv.innerHTML = cart.map(item => `
                <div class="cart-item d-flex justify-content-between mb-2 pb-2 border-bottom">
                    <div><strong>${item.name}</strong><br><small>$${item.price.toFixed(2)} x ${item.quantity}</small></div>
                    <div>$${(item.price * item.quantity).toFixed(2)} <button class="btn btn-sm btn-danger remove-item" data-id="${item.id}">🗑️</button></div>
                </div>
            `).join('');
            const total = cart.reduce((s, i) => s + i.price * i.quantity, 0);
            cartTotalSpan.textContent = `$${total.toFixed(2)}`;
            document.querySelectorAll('.remove-item').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(btn.dataset.id);
                    cart = cart.filter(i => i.id !== id);
                    updateCartUI();
                });
            });
        }

        function openCart() { cartDrawer.classList.add('open'); cartOverlay.style.display = 'block'; }
        function closeCart() { cartDrawer.classList.remove('open'); cartOverlay.style.display = 'none'; }

        async function placeOrder() {
            if (cart.length === 0) { alert('Cart is empty'); return; }
            const customerName = prompt('Enter your name:') || 'Guest';
            const items = cart.map(i => ({ id: i.id, name: i.name, price: i.price, quantity: i.quantity }));
            const total = cart.reduce((s, i) => s + i.price * i.quantity, 0);
            try {
                const res = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tableId: null, customerName, items, total, paymentMethod: 'table', customerNote: '' })
                });
                const data = await res.json();
                if (data.success) {
                    alert(`Order placed! Your order number: ${data.orderId}`);
                    cart = [];
                    updateCartUI();
                    closeCart();
                } else alert('Order failed');
            } catch(err) { alert('Network error'); }
        }

        function trackOrder() {
            const orderId = prompt('Enter your order number:');
            if (orderId) window.location.href = `/api/orders/${orderId}`;
        }

        navMenu.addEventListener('click', () => { closeCart(); });
        navCart.addEventListener('click', openCart);
        navTrack.addEventListener('click', trackOrder);
        closeCartBtn.addEventListener('click', closeCart);
        cartOverlay.addEventListener('click', closeCart);
        checkoutBtn.addEventListener('click', placeOrder);
        loadMenu();
    </script>
</body>
</html>
