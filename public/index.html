<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>TableBite - Restaurant Ordering</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="hero-card">
        <h1>🍽️ TableBite</h1>
        <p>Premium Dining Experience – Order from your table</p>
    </div>

    <div class="container mt-4">
        <div id="user-area" class="mb-3 text-end">
            <button class="btn btn-sm btn-outline-secondary" id="user-btn">👤 Sign In</button>
        </div>
        <div id="categories" class="mb-4"></div>
        <div id="menu-container" class="row"></div>
    </div>

    <div class="bottom-nav">
        <button id="nav-menu" class="btn active">📋 Menu</button>
        <button id="nav-cart" class="btn position-relative">🛒 Cart <span id="cart-count" class="cart-badge">0</span></button>
        <button id="nav-orders" class="btn">📦 My Orders</button>
    </div>

    <!-- Cart drawer -->
    <div id="cart-overlay" class="cart-overlay"></div>
    <div id="cart-drawer" class="cart-drawer">
        <div class="cart-header"><h4>Your Order</h4><button id="close-cart" class="btn-close"></button></div>
        <div id="cart-items" class="cart-items"></div>
        <div class="cart-footer">
            <div class="d-flex justify-content-between mb-3"><strong>Total:</strong><strong id="cart-total">$0.00</strong></div>
            <button id="checkout-btn" class="btn btn-primary w-100">Place Order</button>
        </div>
    </div>

    <!-- Login/Register Modal -->
    <div class="modal fade" id="authModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Sign In / Create Account</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <ul class="nav nav-tabs mb-3" id="authTab" role="tablist">
                        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#login">Login</button></li>
                        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#register">Register</button></li>
                    </ul>
                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="login">
                            <form id="login-form">
                                <div class="mb-2"><input type="email" id="login-email" class="form-control" placeholder="Email" required></div>
                                <div class="mb-2"><input type="password" id="login-password" class="form-control" placeholder="Password" required></div>
                                <button type="submit" class="btn btn-primary w-100">Login</button>
                            </form>
                        </div>
                        <div class="tab-pane fade" id="register">
                            <form id="register-form">
                                <div class="mb-2"><input type="text" id="reg-name" class="form-control" placeholder="Name (optional)"></div>
                                <div class="mb-2"><input type="email" id="reg-email" class="form-control" placeholder="Email" required></div>
                                <div class="mb-2"><input type="password" id="reg-password" class="form-control" placeholder="Password" required></div>
                                <button type="submit" class="btn btn-success w-100">Create Account</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- My Orders Modal -->
    <div class="modal fade" id="ordersModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header"><h5>My Orders</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body" id="orders-list"><p class="text-muted">Loading...</p></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="/app.js"></script>
</body>
</html>
<!-- Add this button inside the hero-card or near the search -->
<div class="text-center mt-3">
    <button id="scan-qr-btn" class="btn btn-light">📷 Scan QR Code</button>
</div>

<!-- Modal for camera scanner -->
<div class="modal fade" id="qrModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header"><h5>Scan QR Code</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body text-center">
                <video id="qr-video" width="100%" style="max-width:300px; border-radius:12px;"></video>
                <canvas id="qr-canvas" style="display:none;"></canvas>
                <div id="qr-result" class="mt-2"></div>
                <button id="switch-camera" class="btn btn-sm btn-secondary mt-2">Switch Camera</button>
                <input type="file" id="qr-file-input" accept="image/*" class="form-control mt-2">
            </div>
        </div>
    </div>
</div>
